<!DOCTYPE html>
<!--
  This is a scratch test harness, not the real product UI. It exists so
  you can exercise the ENTIRE flow — including an actual completed
  Razorpay test payment — before the real frontend is built. Delete this
  file once app/agent/page.tsx exists.

  Served at http://localhost:3000/test-checkout.html once `npm run dev`
  is running (same-origin as the API routes, so no CORS setup needed).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AgentPay — Test Harness</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #18181b; }
    h1 { font-size: 18px; }
    .product { border: 1px solid #e4e4e7; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .product.out-of-stock { opacity: 0.5; }
    button { background: #1f3fa3; color: white; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
    button:disabled { background: #a1a1aa; cursor: not-allowed; }
    #log { background: #f4f4f5; border-radius: 8px; padding: 12px 16px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin-top: 16px; max-height: 400px; overflow-y: auto; }
    .price { color: #52525b; font-size: 13px; }
    .name { font-weight: 500; }
  </style>
</head>
<body>
  <h1>AgentPay test harness (not the real UI — for exercising the API before the frontend exists)</h1>
  <p style="font-size: 13px; color: #52525b;">
    Test card: <code>4111 1111 1111 1111</code>, any future expiry, any CVV, OTP 4–10 digits (e.g. <code>123456</code>) to succeed, under 4 digits to fail.
    Test UPI: <code>success@razorpay</code> or <code>failure@razorpay</code>.
  </p>

  <div id="products">Loading products…</div>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(label, data) {
      logEl.textContent += `\n--- ${label} ---\n${JSON.stringify(data, null, 2)}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function loadProducts() {
      const res = await fetch('/api/products');
      const { products } = await res.json();
      const container = document.getElementById('products');
      container.innerHTML = '';

      if (!products.length) {
        container.textContent = 'No products found — did you run `npm run seed`?';
        return;
      }

      for (const p of products) {
        const div = document.createElement('div');
        div.className = 'product' + (p.stock <= 0 ? ' out-of-stock' : '');
        div.innerHTML = `
          <div>
            <div class="name">${p.name}</div>
            <div class="price">₹${(p.price / 100).toFixed(2)} · ${p.category} · stock: ${p.stock}</div>
          </div>
          <button data-id="${p._id}" data-name="${p.name}">Buy</button>
        `;
        div.querySelector('button').onclick = () => buy(p._id, p.name);
        container.appendChild(div);
      }
    }

    async function buy(productId, name) {
      logEl.textContent = '';
      const confirmed = confirm(`Confirm purchase of "${name}"? (This simulates the explicit user-confirmation step.)`);
      const idempotencyKey = crypto.randomUUID();

      const orderRes = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId, userConfirmed: confirmed, idempotencyKey, userQuery: 'manual test harness' }),
      });
      const orderData = await orderRes.json();
      log(`POST /api/orders (status ${orderRes.status})`, orderData);

      if (!orderData.allowed) {
        alert(`Blocked by policy engine: ${orderData.reason}`);
        return;
      }

      const rzp = new Razorpay({
        key: orderData.keyId,
        amount: orderData.razorpayOrder.amount,
        currency: orderData.razorpayOrder.currency,
        order_id: orderData.razorpayOrder.id,
        name: 'AgentPay (test mode)',
        description: name,
        handler: async function (response) {
          log('Razorpay Checkout returned', response);
          const verifyRes = await fetch('/api/payments/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(response),
          });
          const verifyData = await verifyRes.json();
          log(`POST /api/payments/verify (status ${verifyRes.status})`, verifyData);
          alert(verifyData.verified ? 'Payment verified — order marked paid.' : 'Verification failed — check the log.');
          loadProducts();
        },
        modal: {
          ondismiss: function () {
            log('Checkout dismissed', { note: 'User closed the popup without paying.' });
          },
        },
      });

      rzp.on('payment.failed', function (response) {
        log('Razorpay payment.failed event', response.error);
      });

      rzp.open();
    }

    loadProducts();
  </script>
</body>
</html>
